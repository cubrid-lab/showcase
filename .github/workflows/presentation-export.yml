name: Export presentation formats

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'presentation/**'
      - '.github/workflows/presentation-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: presentation/package-lock.json
      - name: Install dependencies
        working-directory: presentation
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright-chromium
          npx playwright install --with-deps chromium
      - name: Build HTML
        working-directory: presentation
        run: npm run build:site
        env:
          PAGES_BASE_PATH: /showcase
      - name: Export PDF and PPTX
        working-directory: presentation
        run: |
          npm run export:ossdevcon:pdf
          npm run export:ossdevcon:pptx
      - name: Verify outputs
        run: |
          test -s site-dist/index.html
          test -s presentation/exports/ossdevcon.pdf
          test -s presentation/exports/ossdevcon.pptx
      - uses: actions/upload-artifact@v4
        with:
          name: ossdevcon-presentation-${{ github.sha }}
          path: |
            site-dist/
            presentation/exports/ossdevcon.pdf
            presentation/exports/ossdevcon.pptx
          if-no-files-found: error
          retention-days: 30
