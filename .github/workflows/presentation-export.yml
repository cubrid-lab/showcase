name: Export presentation formats

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'presentation/**'
      - 'scripts/build_site.mjs'
      - 'scripts/package_presentations.py'
      - '.github/workflows/presentation-export.yml'
  pull_request:
    paths:
      - 'presentation/**'
      - 'scripts/build_site.mjs'
      - 'scripts/package_presentations.py'
      - '.github/workflows/presentation-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: presentation/package-lock.json
      - name: Install dependencies
        working-directory: presentation
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright-chromium@1.64.1
          npx playwright install --with-deps chromium
      - name: Build HTML
        working-directory: presentation
        run: npm run build:site
        env:
          PAGES_BASE_PATH: /showcase
          # Also build each deck with a relative base for the release HTML ZIP.
          HTML_BUNDLE_DIR: ${{ github.workspace }}/presentation/exports/html
      - name: Export PDF and PPTX
        working-directory: presentation
        run: |
          npm run export:ossdevcon:pdf
          npm run export:ossdevcon:pptx
          npm run export:operator:pdf
          npm run export:operator:pptx
      - name: Verify outputs
        run: |
          test -s site-dist/index.html
          test -s site-dist/contests/2026-ossdevcon/index.html
          test -s site-dist/events/2026-builder-season4/01-validation/ko/index.html
          test -s site-dist/events/2026-builder-season4/01-validation/en/index.html
          # Checks every deck: page/slide/notes counts, blank pages, missing files.
          python3 -m pip install --no-cache-dir --target "$RUNNER_TEMP/verify-pydeps" pypdf==6.20.0
          (cd presentation && PYTHONPATH="$RUNNER_TEMP/verify-pydeps" python3 scripts/verify_exports.py)
      - name: Package release files
        run: |
          PYTHONPATH="$RUNNER_TEMP/verify-pydeps" python3 scripts/package_presentations.py \
            --html presentation/exports/html --out presentation/exports/releases
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: presentations-${{ github.sha }}
          path: |
            site-dist/
            presentation/exports/releases/
          if-no-files-found: error
          retention-days: 30
