name: Export presentation formats

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'presentation/**'
      - '.github/workflows/presentation-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: presentation/package-lock.json
      - name: Install dependencies
        working-directory: presentation
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright-chromium@1.64.1
          npx playwright install --with-deps chromium
      - name: Build HTML
        working-directory: presentation
        run: npm run build:site
        env:
          PAGES_BASE_PATH: /showcase
      - name: Export PDF and PPTX
        working-directory: presentation
        run: |
          npm run export:ossdevcon:pdf
          npm run export:ossdevcon:pptx
      - name: Verify outputs
        run: |
          test -s site-dist/index.html
          test -s presentation/exports/ossdevcon.pdf
          test -s presentation/exports/ossdevcon.pptx
          python3 -m pip install --no-cache-dir --target "$RUNNER_TEMP/verify-pydeps" pypdf==6.20.0
          (cd presentation && PYTHONPATH="$RUNNER_TEMP/verify-pydeps" python3 scripts/verify_exports.py)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ossdevcon-presentation-${{ github.sha }}
          path: |
            site-dist/
            presentation/exports/ossdevcon.pdf
            presentation/exports/ossdevcon.pptx
          if-no-files-found: error
          retention-days: 30
